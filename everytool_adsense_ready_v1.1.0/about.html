<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>서비스 소개 | 모두의 도구</title><meta name="description" content="모두의 도구 서비스 소개"><style>
    :root{--bg:#f5f7fb;--surface:#fff;--ink:#172033;--muted:#68738a;--line:#e7ebf2;--primary:#5b65e8;--primary2:#7982ff;--soft:#eef0ff;--dark:#101827;--radius:18px;--shadow:0 10px 35px rgba(26,39,70,.06)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}
    button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
    .topbar{height:72px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
    .nav{max-width:1180px;height:100%;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.7px}.brand-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#5965ec,#8990ff);display:grid;place-items:center;color:white;font-size:18px;box-shadow:0 6px 14px #6872e744}
    .navlinks{display:flex;gap:25px;color:#59647a;font-size:14px;font-weight:600}.navlinks a:hover{color:var(--primary)}.nav-cta{border:0;border-radius:11px;padding:10px 15px;background:var(--soft);color:var(--primary);font-weight:700}
    .hero{background:radial-gradient(ellipse at 78% 0%,#424eaa 0%,transparent 38%),linear-gradient(120deg,#111a2b,#202d50 68%,#29366b);color:#fff;padding:76px 24px 85px}
    .hero-inner{max-width:1180px;margin:auto}.eyebrow{display:inline-flex;align-items:center;gap:7px;border:1px solid #ffffff30;background:#ffffff12;padding:7px 11px;border-radius:99px;color:#d9ddff;font-size:12px;font-weight:700}
    .hero h1{font-size:clamp(36px,5.5vw,58px);line-height:1.13;letter-spacing:-2.2px;margin:20px 0 15px;max-width:700px}.hero h1 span{color:#aeb5ff}.hero p{color:#c6cce0;font-size:16px;margin:0 0 28px}
    .searchbox{display:flex;align-items:center;gap:12px;max-width:620px;background:#fff;padding:8px 9px 8px 17px;border-radius:15px;box-shadow:0 15px 40px #070d1c55}.searchbox .glass{color:#79839a;font-size:19px}.searchbox input{flex:1;min-width:0;border:0;outline:0;color:var(--ink);padding:9px 0}.searchbox button{border:0;background:var(--primary);color:white;border-radius:10px;padding:12px 19px;font-weight:700}
    .hero-stats{display:flex;gap:25px;margin-top:24px;color:#c1c9e0;font-size:13px}.hero-stats b{color:white}
    .container{max-width:1180px;margin:auto;padding:0 24px}.ad-slot{margin:26px auto 34px;min-height:94px;border:1px dashed #cbd2df;border-radius:14px;background:#fbfcfe;display:flex;align-items:center;justify-content:center;text-align:center;color:#9aa3b4;font-size:12px;position:relative;overflow:hidden}
    .ad-slot strong{display:block;color:#7e8798;font-size:13px;margin-bottom:3px}.ad-slot small{font-size:11px}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:42px 0 18px}.section-head h2{font-size:25px;letter-spacing:-.8px;margin:0}.section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.count{font-size:13px;color:var(--muted)}
    .categories{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 22px}.chip{border:1px solid var(--line);background:#fff;color:#59647a;border-radius:99px;padding:9px 15px;font-size:13px;font-weight:700}.chip.active,.chip:hover{background:var(--soft);border-color:#d8dcff;color:var(--primary)}
    .tool-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.tool-card{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:19px;text-align:left;transition:.2s;box-shadow:0 2px 8px #18243a05;min-height:170px;display:flex;flex-direction:column}.tool-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#cfd3ff}.tool-icon{width:42px;height:42px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:21px;margin-bottom:14px}.tool-card h3{font-size:15px;margin:0 0 5px;letter-spacing:-.3px}.tool-card p{font-size:12px;color:var(--muted);margin:0;line-height:1.55}.tool-card .tag{margin-top:auto;padding-top:12px;color:#8a93a5;font-size:11px}
    .feature{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin:45px 0}.feature-card{border-radius:20px;padding:26px;background:#fff;border:1px solid var(--line)}.feature-card.dark{background:linear-gradient(135deg,#202b4a,#394681);color:white;border:0}.feature-card h3{font-size:20px;margin:0 0 8px}.feature-card p{font-size:13px;color:var(--muted);margin:0}.feature-card.dark p{color:#c9d0e8}.feature-points{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.feature-points span{background:#ffffff18;border:1px solid #ffffff22;padding:7px 10px;border-radius:9px;font-size:11px;color:#e4e7ff}
    .faq{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:50px}.faq details{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px 18px}.faq summary{font-weight:700;font-size:14px;cursor:pointer}.faq details p{font-size:13px;color:var(--muted);margin:12px 0 0}
    footer{background:#111a2a;color:#c5ccdc;padding:36px 24px}.footer-inner{max-width:1180px;margin:auto;display:flex;justify-content:space-between;gap:25px;flex-wrap:wrap}.footer-brand{color:#fff;font-weight:800;font-size:17px}.footer-links{display:flex;gap:18px;flex-wrap:wrap;font-size:12px}.footer-links button{background:none;border:0;color:#c5ccdc;padding:0}.copyright{width:100%;font-size:11px;color:#7f8aa1;border-top:1px solid #ffffff18;padding-top:18px;margin-top:10px}
    .modal-backdrop{position:fixed;inset:0;background:#0c1426a8;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal-backdrop.open{display:flex}.modal{background:#fff;border-radius:20px;width:min(560px,100%);max-height:88vh;overflow:auto;box-shadow:0 30px 90px #0004}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}.modal-head h2{font-size:18px;margin:0}.close{border:0;background:#f0f2f7;border-radius:9px;width:34px;height:34px;font-size:19px}.modal-body{padding:22px}.field{margin-bottom:15px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px;color:#46516a}.field input,.field textarea,.field select{width:100%;border:1px solid #dfe4ed;border-radius:10px;padding:12px;outline:0;background:#fff}.field input:focus,.field textarea:focus{border-color:#8189f2;box-shadow:0 0 0 3px #747cf21c}.field textarea{min-height:85px;resize:vertical}.primary{border:0;background:var(--primary);color:#fff;padding:12px 17px;border-radius:10px;font-weight:700}.result{margin-top:15px;background:#f1f3ff;border:1px solid #e0e3ff;padding:14px;border-radius:12px;font-weight:700;color:#3943ad;word-break:break-word}.hint{font-size:11px;color:#8992a4;margin-top:7px}.tool-content h3{font-size:14px;margin:22px 0 7px}.tool-content p{font-size:13px;color:var(--muted);margin:0 0 10px}.tool-content .formula{background:#f6f7fa;border-radius:10px;padding:12px;font-size:12px;color:#566178}
    .empty{grid-column:1/-1;text-align:center;padding:45px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:15px}
    @media(max-width:900px){.tool-grid{grid-template-columns:repeat(3,1fr)}.navlinks{gap:13px}.feature{grid-template-columns:1fr}}
    @media(max-width:650px){.topbar{height:62px}.nav{padding:0 16px}.navlinks{display:none}.hero{padding:55px 0 62px}.container{padding:0 16px}.hero h1{letter-spacing:-1.5px}.hero p{font-size:14px}.hero-stats{gap:13px;flex-wrap:wrap}.tool-grid{grid-template-columns:repeat(2,1fr);gap:10px}.tool-card{padding:15px;min-height:160px}.section-head h2{font-size:21px}.faq{grid-template-columns:1fr}.ad-slot{min-height:80px}.feature-card{padding:21px}}
    @media(max-width:370px){.tool-grid{grid-template-columns:1fr}.searchbox button{padding:11px 12px}}
  </style></head><body><main class="container" style="padding:50px 20px;min-height:75vh"><a href="/">← 홈으로</a><h1>서비스 소개</h1><p style="max-width:780px;line-height:2">모두의 도구는 계산, 날짜, 글쓰기, 개발 작업에 필요한 브라우저 기반 무료 도구를 제공합니다. 사용법과 계산 기준을 함께 안내하여 결과를 쉽게 이해하도록 돕습니다. 별도의 회원가입 없이 이용할 수 있습니다.</p></main></body></html>
